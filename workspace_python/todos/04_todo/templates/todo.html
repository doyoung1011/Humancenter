<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>전체 목록</h1>
    <div>
        <a herf="/add">
            <button type="button">
                추가
            </button>
        </a>
        
    </div>
    <table border=1>
        <tr>
            <th>{id}</th>
            <th>{item}</th>
        </tr>
        <tbody>
        {% if list %}

           {% for todo in list %}
           <tr>
            <td>{{todo.id}}</td>
            <td>{{todo.item}}</td>
           </tr>
           {% endfor%}
        {% else %}
            <tr>
                <td colspan="2">조회할 목록이 없대요</td>

            </tr>
        {% endif %}
        </tbody>
    </table>
    <div>
        {#{{list}}#}
      

    </div>

  </body>
</html>
