<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    
</head>
<body>
  <header class="site-header">
  <!-- 로고 -->
  <!-- 왼쪽: 로고 -->
   <!-- 로고 누르면 다시 사이트로 돌아감 -->
  <a href="/dsinside" class="site-logo">
    <img
      src="/static/images/KakaoTalk_20260902_172536230.png"
      alt="Dish Inside 로고"
    >
  </a>

     
  <!-- 사이트 소개 -->
  <a href="/soge" class="intro-link">소개</a>

  <!-- 검색창 -->
  <!-- 가운데: 검색창 -->
  <form class="search-form" method="get" action="/search">
    <input
      type="search"
      id="search-word"
      name="keyword"
      aria-label="맛집 검색"
      placeholder="식당 이름이나 지역을 검색하세요"
    >

    <button type="submit">검색</button>
  </form>

  <!-- 오른쪽 메뉴 -->
  <nav class="member-area" aria-label="사용자 메뉴">
    <a href="/board" class="board-link">소통 창구</a>
    <a href="/mypage" class="profile-link">프로필</a>
    <a href="/login" class="login-link">로그인</a>
  </nav>
</header>

    
</body>
</html>
