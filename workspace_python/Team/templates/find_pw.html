<!doctype html>

<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>비밀번호 재설정</title>

<link rel="stylesheet" href="/static/css/header.css">
<link rel="stylesheet" href="/static/css/find_pw.css">


  </head>

  <body>

<main class="find-pw-page">

  <section class="find-pw-box">

    <a href="/login" class="back-link">← 로그인으로 돌아가기</a>

    <div class="find-pw-title">

      <span class="find-pw-badge">DI</span>

      <h1>비밀번호 재설정</h1>

      <p>
        새로운 비밀번호를 설정해주세요.
      </p>

    </div>

    <form method="post" action="/api/find_pw" class="find-pw-form">

      <div class="input-group">

        <label for="member-id">아이디</label>

        <input
          type="text"
          id="member-id"
          name="member_id"
          placeholder="아이디를 입력하세요"
          required
        >

      </div>

      <div class="input-group">

        <label for="new-password">새 비밀번호</label>

        <input
          type="password"
          id="new-password"
          name="member_pw"
          placeholder="새 비밀번호를 입력하세요"
          required
        >

      </div>

      <div class="input-group">

        <label for="check-password">새 비밀번호 확인</label>

        <input
          type="password"
          id="check-password"
          name="member_pw_check"
          placeholder="새 비밀번호를 다시 입력하세요"
          required
        >

      </div>

      {% if error %}
        <p class="find-pw-error">{{ error }}</p>
      {% endif %}

      <button type="submit" class="find-pw-button">
        비밀번호 변경
      </button>

    </form>

    <div class="login-area">
      <span>비밀번호를 변경하셨나요?</span>
      <a href="/login">로그인</a>
    </div>

  </section>

</main>


  </body>
</html>
