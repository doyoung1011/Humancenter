    <script>
      //json
      // 값을 key와 value로 관리함
      // 단, 순서는 보장 X

      // json 선언
      let json = {};
      json = {
        key: "value",
        num: 1234,
        fn: function () {
          console.log(1);
        },
        k1: {
          "k1-1": 1,
          "k1-2": 2,
        },
      };

      console.log(json);
      console.log("" + json);
      //   값에 접근하는 방법
      // 방법1: 배열처럼
      console.log(json["key"]);
      console.log(json["num"]);
      console.log(json["k1"]["k1-1"]);

      // 방법2:프로퍼티 처럼 접근 가능!
      console.log(json.key);
      console.log(json.k1.k1 - 2);
      // console.log(json.k1.k)
      json["fn"]();
      //    값 넣기

      json.num = 456;
      console.log(json.num);
      console.log(json.num2);
      //   json.num2=222
      //   console.log(num2)
      console.log(json);

      //   네트워크 통신할 떄 무조건 문자로 가야함
      // stringify: json을 문자열로 만들어 준다
      // 단, 값이 함수인 것은 제외

      const str = JSON.stringify(json);
      console.log(str);

      const json2=JSON.parse(str)
      console.log(json2)
