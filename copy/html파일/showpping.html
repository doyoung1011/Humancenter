<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css목록/showpping.css">
</head>

<body>
    <!-- 최상단 감싸는 용도 -->
    <div class="wrapper">
        <div class="header">
            <a> <img src="https://upload.wikimedia.org/wikipedia/commons/d/dd/YouTube_Premium_logo.svg" alt="유튜브프리미엄로고">
            </a>
            <div class="searchbox">
                <input type="text" placeholder="검색">
            </div>
        </div>
        <!-- 여기가 재생 영상 및 댓글 오른쪽 추천영상 -->
        <div class="contents">
            <div class="left_area">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/paJ8svJ1IoE?si=7E35vS3Z_XeLCEnS"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                <div class="comment_area">
                    댓글
                </div>


            </div>

            <div class="right_area">
                <div class="suggested_video">
                    추천영상목록 쫘라라락 세로로나올예정
                </div>
            </div>

        </div>




    </div>

</body>

</html>
