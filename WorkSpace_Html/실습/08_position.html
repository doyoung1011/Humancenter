<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>relative 실습</title>
    <link rel="stylesheet" href="../css/asset/css/08_position.css">

</head>

<body id="top">

    <div class="parent">
        <div>L</div>
        <div>O</div>
        <div>V</div>
        <div>E</div>
    </div>

    relative
    <div class="parent">
        <div>L</div>
        <div class="relative">O</div>
        <div>V</div>
        <div>E</div>
    </div>


    absolute
    <div class="parent">
        <div>L</div>
        <div class="absolute">O</div>
        <div>V</div>
        <div class="absolute">E</div>
    </div>

    <div class="fixed">
        <a href="#top">맨위로</a>
    </div>

    <div class="sticky">
        <a href="#top">맨위로</a>
    </div>

    <div class="parent2">
        <div class="rel z1">1번</div>
        <div class="rel z2">2번</div>
        <div class="rel z3">3번</div>
    </div>

    <hr>
    <div class="menu">
        메뉴1 메뉴2 메뉴3
        <div class="submenu">
            메뉴1-1 메뉴 2-1 메뉴 3-1<br>
            메뉴1-2 메뉴 2-2 메뉴 3-2
        </div>
    </div>

    <div class="p1">
        부모 박스
        <div class="c1">
            자식박스
        </div>
    </div>

</body>

</html>
