<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* offset-x, offset-y */
        .red {
            text-shadow: 10px 3px red;
        }

        .blur {
            text-shadow: 0px 3px 2px red;
            color: white;
            font-size: 2em;
        }

        .box {
            border: 1px solid red;
            width: 100px;

            box-shadow: 10px 5px 10px gray;
        }

        .box2{
            border: 1px solid black;
            width: 150px;
            height: 200px;
            margin: 10px;


        }
        .box2:hover {
             box-shadow: 10px 5px 10px gray;
             cursor: pointer;
        }
       
    </style>
</head>

<body>
    <div class="red">
        한글 shadow
    </div>
    <div class="blur">
        한글 shadow
    </div>

    <div class="box">
        박스 shadow
    </div>

    <div class="box2">
        마우스를 올리시오
    </div>

</body>

</html>
