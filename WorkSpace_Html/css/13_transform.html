<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            border: 1px solid red;
            height: 100px;
            width: 100px;
            background-color: green;
            color: white;
            margin: 10px;

            transition: all 0.5s;
        }

        .translate:hover {
            transform: translate(50%, 50%);
        }

        .scale:hover {
            transform: scale(15);

        }

        .rotate:hover {
            transform: rotate(-30deg);
        }

        .total:hover {
            transform: translate(50%, 50%) scale(1.5) rotate(-3deg);
        }

        .parent {
            border: 1px solid red;
            width: 40%;
            height: 40vh;

            position: relative;
        }

        .parent .child {
            width: 30%;
            height: 30%;
            border: 1px solid blue;

            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(-50%,-50%);

        }
    </style>
</head>

<body>
    <div class="box box1">비교</div>
    <div class="box translate">translate</div>
    <div class="box scale">scale</div>
    <div class="box rotate">rotate</div>
    <div class="box total">total</div>

    <hr>
    <div class="parent">
        <div class="child"></div>
    </div>

</body>

</html>
