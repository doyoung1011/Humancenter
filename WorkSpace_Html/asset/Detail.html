   <style>
        h1 {
            text-align: right;
        }
*{
        border: 1px solid red;
}

            padding: 0 30px;

            text-align: center;
            font-size: 20px;
        }

        #vote>div {
            cursor: pointer;
            max-width: 30%;

            flex-grow: 1;
        }

        #vote .btn {
            width: 100%;
            height: 150px;
            line-height: 150px;
            /* border: 1px solid black; */
            border-radius: 50%;
            margin-bottom: 10px;

            background-position: center center;
            background-size: contain;
            background-repeat: no-repeat;

        }

        #btn_vote_1 {
            background-image: url("./assets/image/positive.webp");
        }

        #btn_vote_2 {
            background-image: url("./assets/image/normal.webp");
        }

        #btn_vote_3 {
            background-image: url("./assets/image/negative.png");
        }

        #btn_speed_1 {
            background-color: #006b3ebb;
            color: #ffffff;
        }

        #btn_speed_2 {
            background-color: #ffaa1cbb;
        }

        #btn_speed_3 {
            background-color: #ed2938bb;
            color: #ffffff;
        }

        #speed {
            height: 100px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin-bottom: 40px;
            padding: 0 30px;
        }

        #speed .btn {
            width: 100px;
            height: 75px;
            line-height: 75px;
            text-align: center;
            border-radius: 10%;

            cursor: pointer;
        }

            background-color: #ffaa1cbb;
            padding: 10px;
            margin-top: 10px;
        }

            margin: 10px 0;
            border-bottom: 1px black dotted;
            display: flex;
            align-items: flex-start;
        }

        #write #opinion .article .time {
            margin-right: 10px;
            font-size: 12px;
            line-height: 16px;
            color: white;
            background-color: #69a850;
            padding: 2px;
        }

            justify-content: center;
            flex-direction: column;
        }

            user-select: none;
            min-width: 50px;
            cursor: pointer;
            position: relative;
            z-index: 1000;
        }

        #write #opinion .article .like .like-count {
            margin-left: 5px;

            width: 22px;
            text-align: right;
        }

            position: absolute;
            color: red;
            font-size: 20px;
            animation: float 2s linear forwards;
            user-select: none;
        }

        @keyframes float {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }

            30% {
                opacity: 0.5;
                transform: translate(10px, -33px) scale(1.3);
            }

            60% {
                opacity: 0.5;
                transform: translate(-5px, -60px) scale(1.6);
            }

            100% {
                opacity: 0;
                transform: translate(5px, -100px) scale(2);
            }
        }

            box-sizing: border-box;
            width: 100%;
            margin-bottom: 10px;
            padding: 0 60px;

            display: none;

        .vote ul {
            padding: 0;

            list-style: none;

            height: 500px; */

        }
